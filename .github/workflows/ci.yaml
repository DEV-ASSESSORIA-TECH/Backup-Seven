name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell validation modules
        run: |
          # Some Windows runner images start without the PSGallery registration.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
              Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force

      - name: Verify DBBackup source and package contracts
        run: ./scripts/verify.ps1

      - name: Build DBBackup distribution
        run: ./scripts/package.ps1

      - name: Upload package and checksum
        uses: actions/upload-artifact@v4
        with:
          name: DBBackup-package
          path: |
            dist/DBBackup-*.zip
            dist/DBBackup-*.zip.sha256
          if-no-files-found: error
